[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eeg-agent-rag"
version = "0.1.0"
description = "Standalone Milvus hybrid-RAG service with evidence citations and EEG Agent integration"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "EEG-Agent-RAG contributors"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "pymilvus>=2.6,<2.7",
  "PyMuPDF>=1.24",
  "httpx>=0.27,<1.0",
  "openai>=1.60,<3.0",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.2,<6.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
eeg-rag = "eeg_agent_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eeg_agent_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
